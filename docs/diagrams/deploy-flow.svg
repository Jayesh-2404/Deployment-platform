<svg xmlns="http://www.w3.org/2000/svg" width="820" height="660" viewBox="0 0 820 660" font-family="Virgil, Caveat, 'Segoe Print', 'Comic Sans MS', cursive">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="820" height="660" fill="#ffffff"/>
  <g font-size="14" fill="#1e1e1e">
    <rect x="130" y="12" width="560" height="52" rx="8" fill="#fff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="150" y="33" font-weight="700">1. POST /projects/{id}/deployments</text>
    <text x="150" y="52" font-size="12" fill="#555">row status = queued, log "Deployment queued"</text>
    <line x1="410" y1="64" x2="410" y2="84" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="130" y="86" width="560" height="52" rx="8" fill="#fff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="150" y="107" font-weight="700">2. Worker poll (1s ticker)</text>
    <text x="150" y="126" font-size="12" fill="#555">oldest queued / rollback job, one at a time</text>
    <line x1="410" y1="138" x2="410" y2="158" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="130" y="160" width="560" height="52" rx="8" fill="#fff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="150" y="181" font-weight="700">3. cloning -&gt; building</text>
    <text x="150" y="200" font-size="12" fill="#555">Executor.Deploy: clone, metadata, Dockerfile strategy</text>
    <line x1="410" y1="212" x2="410" y2="232" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="130" y="234" width="560" height="52" rx="8" fill="#fff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="150" y="255" font-weight="700">4. build + start candidate</text>
    <text x="150" y="274" font-size="12" fill="#555">each step -&gt; AddLog -&gt; SSE broadcast</text>
    <line x1="410" y1="286" x2="410" y2="306" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="130" y="308" width="560" height="52" rx="8" fill="#fff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="150" y="329" font-weight="700">5. deploying -&gt; running_health_check</text>
    <text x="150" y="348" font-size="12" fill="#555">imageTag saved, GET healthCheckPath</text>
    <line x1="310" y1="360" x2="310" y2="380" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr3)"/>
    <line x1="510" y1="360" x2="510" y2="380" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="40" y="382" width="340" height="62" rx="8" fill="#eef7ee" stroke="#1e1e1e" stroke-width="2"/>
    <text x="60" y="405" font-weight="700">6a. pass -&gt; success</text>
    <text x="60" y="425" font-size="12" fill="#333">activeDeploymentId = new, Caddy -&gt; new</text>
    <rect x="440" y="382" width="340" height="62" rx="8" fill="#fdeeee" stroke="#1e1e1e" stroke-width="2"/>
    <text x="460" y="405" font-weight="700">6b. fail -&gt; failed</text>
    <text x="460" y="425" font-size="12" fill="#333">old container keeps traffic</text>
    <line x1="410" y1="444" x2="410" y2="466" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="130" y="468" width="560" height="52" rx="8" fill="#fff" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="150" y="489" font-weight="700">7. Rollback = new row (rollbackTo)</text>
    <text x="150" y="508" font-size="12" fill="#555">start old image, check, point back, mark rolled_back</text>
    <line x1="410" y1="520" x2="410" y2="542" stroke="#1e1e1e" stroke-width="2" marker-end="url(#arr3)"/>
    <rect x="130" y="544" width="560" height="52" rx="8" fill="#fff" stroke="#1e1e1e" stroke-width="2"/>
    <text x="150" y="565" font-weight="700">8. SSE: replay + subscribe</text>
    <text x="150" y="584" font-size="12" fill="#555">ListLogs then SubscribeLogs channel until disconnect</text>
  </g>
  <text x="130" y="624" font-size="12" fill="#555">Statuses: queued -&gt; cloning -&gt; building -&gt; deploying -&gt; running_health_check -&gt; success | failed ; rollback -&gt; success, old -&gt; rolled_back</text>
</svg>
